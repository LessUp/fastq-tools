# =============================================================================
# FastQTools 文档站点配置 - 终极优化版
# Ultimate GitHub Pages Configuration for FastQTools
# =============================================================================

# -----------------------------------------------------------------------------
# 站点基本信息 / Site Information
# -----------------------------------------------------------------------------
site_name: FastQTools
site_description: >
  现代化 C++23 FASTQ 文件处理工具集 — 专为生物信息学高通量测序数据质控设计的高性能解决方案。
  Modern C++23 FASTQ Processing Toolkit - High-Performance Bioinformatics QC Solution.
site_author: LessUp Team
site_url: https://lessup.github.io/fastq-tools/

# -----------------------------------------------------------------------------
# 仓库信息 / Repository Info
# -----------------------------------------------------------------------------
repo_url: https://github.com/LessUp/fastq-tools
repo_name: LessUp/fastq-tools
edit_uri: edit/master/docs/

docs_dir: docs

# -----------------------------------------------------------------------------
# 主题配置 - Material 终极定制 / Theme Configuration
# -----------------------------------------------------------------------------
theme:
  name: material
  custom_dir: docs/overrides
  
  # 颜色方案 - 支持 5 种模式
  palette:
    # 自动模式 / Auto (System Preference)
    - media: "(prefers-color-scheme)"
      scheme: default
      primary: teal
      accent: cyan
      toggle:
        icon: material/brightness-auto
        name: 跟随系统 / Auto Mode
    
    # 亮色模式 / Light Mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: 亮色模式 / Light Mode
    
    # 暗色模式 / Dark Mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: 暗色模式 / Dark Mode
    
    # 深海蓝 / Deep Ocean
    - scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/water
        name: 深海蓝 / Deep Ocean
    
    # 宝石绿 / Emerald
    - scheme: default
      primary: green
      accent: lime
      toggle:
        icon: material/diamond
        name: 宝石绿 / Emerald

  # 字体配置
  font:
    text: 
      - Noto Sans SC
      - Roboto
    code: 
      - JetBrains Mono
      - Fira Code

  # 图标 / Icons
  icon:
    logo: material/dna
    repo: fontawesome/brands/github
    admonition:
      note: material/pencil
      abstract: material/book-open
      info: material/information
      tip: material/sprout
      success: material/check-circle
      question: material/help-circle
      warning: material/alert
      failure: material/close-circle
      danger: material/lightning-bolt
      bug: material/bug
      example: material/format-list-numbered
      quote: material/format-quote-close

  # 功能特性 - 全部开启 / Features
  features:
    # 导航
    - navigation.instant          # 即时加载
    - navigation.instant.progress # 进度条
    - navigation.tracking         # 锚点跟踪
    - navigation.tabs             # 顶部标签
    - navigation.tabs.sticky      # 粘性标签
    - navigation.sections         # 章节分组
    - navigation.expand           # 自动展开
    - navigation.path             # 面包屑路径
    - navigation.top              # 回到顶部
    - navigation.footer           # 页脚导航
    
    # 搜索
    - search.suggest              # 搜索建议
    - search.highlight            # 高亮结果
    - search.share                # 分享搜索
    
    # 内容
    - content.code.copy           # 代码复制
    - content.code.select         # 代码选择
    - content.code.annotate       # 代码注释
    - content.tabs.link           # 标签链接
    - content.action.edit         # 编辑链接
    - content.action.view         # 查看源码
    - content.tooltips            # 工具提示
    
    # 标题
    - toc.follow                  # TOC 跟随
    - toc.integrate               # 集成 TOC

# -----------------------------------------------------------------------------
# 额外资源 / Extra Files
# -----------------------------------------------------------------------------
extra_css:
  - assets/css/custom.css
  - assets/css/animations.css
  - assets/css/code-blocks.css

extra_javascript:
  - assets/javascripts/custom.js
  - assets/javascripts/analytics.js
  # polyfill.io 已移除，现代浏览器原生支持 ES6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

# -----------------------------------------------------------------------------
# 插件配置 - 全部开启 / Plugins
# -----------------------------------------------------------------------------
plugins:
  # i18n 国际化 - 暂时禁用
  # - i18n:
  #     docs_structure: suffix
  #     default_language: zh
  #     languages:
  #       zh:
  #         name: 中文 (Chinese)
  #         site_name: FastQTools
  #         build: true
  #         default: true
  #       en:
  #         name: English
  #         site_name: FastQTools
  #         build: true
  #     material_alternate: true

  # 搜索增强
  - search:
      lang:
        - zh
        - en
      separator: '[\s\-\.]+'
      
  # 代码压缩
  - minify:
      minify_html: true
      minify_js: true
      htmlmin_opts:
        remove_comments: true
        
  # Git 修订日期
  - git-revision-date-localized:
      type: datetime
      timezone: Asia/Shanghai
      locale: zh
      fallback_to_build_date: false
      enable_creation_date: true
      
  # Git 贡献者
  - git-committers:
      repository: LessUp/fastq-tools
      branch: master
      token: !ENV [GITHUB_TOKEN, ""]
      
  # RSS 订阅
  - rss:
      match_path: ".*"
      date_from_meta:
        as_creation: date
        as_update: git_revision_date_localized
      categories:
        - categories
        - tags

  # 图片优化 - 暂时禁用
  # - optimize:
  #     optimize_png: true
  #     optimize_jpg: true
  #     optimize_svg: true

# -----------------------------------------------------------------------------
# 扩展配置 / Extensions
# -----------------------------------------------------------------------------
markdown_extensions:
  # Python Markdown
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
      permalink_title: Anchor link to this section
      toc_depth: 4
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
          
  # Pymdownx 扩展
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
      options:
        custom_icons:
          - assets/icons
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
      linenums: true
      linenums_style: pymdownx-inline
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink:
      repo_url_shorthand: true
      user: LessUp
      repo: fastq-tools
  - pymdownx.mark
  - pymdownx.progressbar
  - pymdownx.snippets:
      auto_append:
        - includes/abbreviations.md
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
        - name: plotly
          class: plotly
          format: !!python/name:mkdocs_plotly_plugin.fences.fence_plotly
  - pymdownx.tabbed:
      alternate_style: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde
  
  # 其他扩展
  - sane_lists
  - smarty:
      substitutions:
        left: "«"
        right: "»"

# -----------------------------------------------------------------------------
# 额外配置 / Extra Config
# -----------------------------------------------------------------------------
extra:
  # 版本信息
  version:
    provider: mike
    default: latest
    
  # 社交链接
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/LessUp/fastq-tools
      name: GitHub Repository
    - icon: fontawesome/brands/docker
      link: https://hub.docker.com/r/lessup/fastqtools
      name: Docker Hub
    - icon: fontawesome/solid/rss
      link: /feed_rss_created.xml
      name: RSS Feed
    - icon: material/email
      link: mailto:support@lessup.dev
      name: Contact Us
      
  # 分析配置
  analytics:
    provider: google
    property: G-XXXXXXXXXX
    feedback:
      title: Was this page helpful?
      ratings:
        - icon: material/emoticon-happy-outline
          name: This page was helpful
          data: 1
          note: >-
            Thanks for your feedback!
        - icon: material/emoticon-sad-outline
          name: This page could be improved
          data: 0
          note: >-
            Thanks for your feedback! Help us improve this page by
            using our <a href="...">feedback form</a>.
            
  # 版权声明
  copyright:
    text: Copyright &copy; 2025-2026 LessUp
    link: https://github.com/LessUp/fastq-tools/blob/master/LICENSE
    
  # 生成器隐藏
  generator: false
  
  # 额外元数据
  manifest: manifest.webmanifest

