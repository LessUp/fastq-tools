# mkdocs.yml — FastQTools 文档站点配置（双语：中文默认 + 英文备选）
site_name: FastQTools
site_description: 现代化 FASTQ 文件处理工具集 — 高性能生物信息学质控工具
site_author: LessUp
site_url: https://lessup.github.io/fastq-tools/
repo_url: https://github.com/LessUp/fastq-tools
repo_name: LessUp/fastq-tools
edit_uri: edit/master/docs/

theme:
  name: material
  language: zh
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: 切换到暗色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: 切换到亮色模式
  font:
    text: Noto Sans SC
    code: JetBrains Mono
  features:
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.action.edit
    - content.tooltips
    - toc.follow
  icon:
    repo: fontawesome/brands/github

exclude_docs: |
  README.md

# ---------------------------------------------------------------------------
# i18n 双语配置
#   - 后缀模式：index.md = 中文（默认），index.en.md = 英文
#   - URL：/ = 中文，/en/ = 英文
# ---------------------------------------------------------------------------
plugins:
  - i18n:
      default_language: zh
      languages:
        zh: 中文
        en: English
  - search:
      lang:
        - zh
        - en
  - minify:
      minify_html: true

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/LessUp/fastq-tools
      name: FastQTools on GitHub
  generator: false

copyright: Copyright &copy; 2025-2026 LessUp — MIT License

