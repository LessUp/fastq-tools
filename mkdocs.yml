# =============================================================================
# FastQTools Documentation Site Configuration
# =============================================================================

site_name: FastQTools
site_description: FASTQ statistics, filtering, and C++ integration for sequencing QC
site_author: FastQTools Team
site_url: https://lessup.github.io/fastq-tools/

repo_url: https://github.com/LessUp/fastq-tools
repo_name: LessUp/fastq-tools
edit_uri: edit/master/docs/

docs_dir: docs

theme:
  name: material
  custom_dir: docs/overrides

  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

  font:
    text: Roboto
    code: Roboto Mono

  icon:
    logo: material/dna
    repo: fontawesome/brands/github

  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.action.edit
    - content.action.view

extra_css:
  - assets/css/custom.css

plugins:
  - search:
      lang:
        - en
        - zh
      separator: '[\s\-\.]+'

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

copyright: >
  Copyright &copy; 2025 FastQTools —
  <a href="https://github.com/LessUp/fastq-tools/blob/master/LICENSE">MIT License</a>

nav:
  - Home: index.md
  - Start Here:
      - Guide Overview: guide/index.en.md
      - Getting Started: guide/getting-started.en.md
      - CLI Reference: guide/cli-reference.en.md
      - Configuration: guide/configuration.en.md
  - Performance:
      - Benchmark Overview: performance/benchmark-report.md
  - Library API:
      - API Overview: api/overview.en.md
      - IO Module: api/io.en.md
      - Processing Pipeline: api/processing.en.md
      - Statistics: api/statistics.en.md
      - Core Utilities: api/core.en.md
  - Developers:
      - Developer Guide: dev/index.en.md
      - Build Guide: dev/build.en.md
      - Architecture: dev/architecture.en.md
      - Testing: dev/testing.en.md
  - Project:
      - Contributing: contributing.en.md
      - Changelog: changelog.en.md
