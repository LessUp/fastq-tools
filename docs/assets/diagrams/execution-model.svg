<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">FastQTools execution model</title>
  <desc id="desc">A flow diagram showing source, processing, sink, and verification loops that explain representative performance evidence.</desc>
  <style>
    text {
      font-family: Inter, "Segoe UI", sans-serif;
      fill: var(--fq-diagram-text);
    }
    .panel {
      fill: currentColor;
      fill-opacity: 0.04;
      stroke: currentColor;
      stroke-width: 2;
      rx: 18px;
    }
    .accent {
      fill-opacity: 0.12;
    }
    .arrow {
      fill: none;
      stroke: currentColor;
      stroke-width: 3;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .label {
      font-size: 24px;
      font-weight: 700;
    }
    .copy {
      font-size: 16px;
    }
  </style>
  <rect width="960" height="420" fill="var(--fq-diagram-bg)" rx="24" />
  <text class="label" x="480" y="54" text-anchor="middle">Representative performance path</text>

  <rect class="panel" x="64" y="112" width="210" height="120" />
  <text class="label" x="169" y="154" text-anchor="middle">Source</text>
  <text class="copy" x="169" y="184" text-anchor="middle">FASTQ input + decompression</text>
  <text class="copy" x="169" y="206" text-anchor="middle">ordered read boundary</text>

  <rect class="panel accent" x="375" y="96" width="210" height="152" />
  <text class="label" x="480" y="138" text-anchor="middle">Processing</text>
  <text class="copy" x="480" y="168" text-anchor="middle">filter / trim / stats</text>
  <text class="copy" x="480" y="190" text-anchor="middle">oneTBB pipeline</text>
  <text class="copy" x="480" y="212" text-anchor="middle">bounded in-flight work</text>

  <rect class="panel" x="686" y="112" width="210" height="120" />
  <text class="label" x="791" y="154" text-anchor="middle">Sink</text>
  <text class="copy" x="791" y="184" text-anchor="middle">writer / report / metrics</text>
  <text class="copy" x="791" y="206" text-anchor="middle">deterministic output edge</text>

  <path class="arrow" d="M274 172 H375" />
  <path class="arrow" d="M585 172 H686" />

  <rect class="panel" x="230" y="298" width="500" height="78" />
  <text class="label" x="480" y="332" text-anchor="middle">Verification loop</text>
  <text class="copy" x="480" y="356" text-anchor="middle">benchmark report → benchmark guide → maintenance policy</text>
  <path class="arrow" d="M480 248 V298" />
</svg>
