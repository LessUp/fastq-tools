<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="cliGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="processingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f093fb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f5576c;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="ioGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4facfe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00f2fe;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="statsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#43e97b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#38f9d7;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="500" fill="#1a1a2e"/>
  
  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" font-family="system-ui, sans-serif" font-size="24" font-weight="bold" fill="#ffffff">FastQTools Architecture</text>
  <text x="400" y="65" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#888">Zero-Copy Parallel Pipeline with Intel oneTBB</text>
  
  <!-- CLI Layer -->
  <rect x="300" y="90" width="200" height="60" rx="8" fill="url(#cliGrad)" filter="url(#shadow)"/>
  <text x="400" y="118" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#fff">CLI Layer</text>
  <text x="400" y="138" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#ddd">stat | filter | trim</text>
  
  <!-- Arrow from CLI to Processing -->
  <path d="M400 150 L400 180" stroke="#fff" stroke-width="2" marker-end="url(#arrowhead)"/>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#fff"/>
    </marker>
  </defs>
  
  <!-- Processing Layer -->
  <rect x="200" y="190" width="400" height="80" rx="8" fill="url(#processingGrad)" filter="url(#shadow)"/>
  <text x="400" y="218" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#fff">Processing Pipeline</text>
  <text x="400" y="238" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#ddd">TBB Parallel Pipeline</text>
  <text x="400" y="258" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#ccc">Predicates (filter) | Mutators (trim) | Transforms</text>
  
  <!-- Arrows from Processing -->
  <path d="M300 270 L200 320" stroke="#fff" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M400 270 L400 320" stroke="#fff" stroke-width="2" marker-end="url(#arrowhead)"/>
  <path d="M500 270 L600 320" stroke="#fff" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- I/O Layer -->
  <rect x="100" y="330" width="180" height="70" rx="8" fill="url(#ioGrad)" filter="url(#shadow)"/>
  <text x="190" y="358" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#fff">I/O Layer</text>
  <text x="190" y="378" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#ddd">FastqReader | FastqWriter</text>
  <text x="190" y="393" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#ccc">string_view zero-copy</text>
  
  <!-- Statistics Layer -->
  <rect x="310" y="330" width="180" height="70" rx="8" fill="url(#statsGrad)" filter="url(#shadow)"/>
  <text x="400" y="358" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#fff">Statistics</text>
  <text x="400" y="378" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#ddd">Calculator | Worker</text>
  <text x="400" y="393" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#ccc">QC Metrics | Signatures</text>
  
  <!-- Memory Pool -->
  <rect x="520" y="330" width="180" height="70" rx="8" fill="#3d3d5c" filter="url(#shadow)"/>
  <text x="610" y="358" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#fff">Memory Pool</text>
  <text x="610" y="378" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#aaa">ObjectPool | Arena</text>
  <text x="610" y="393" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#888">Bounded allocation</text>
  
  <!-- Data Flow Labels -->
  <text x="250" y="300" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#888">Records</text>
  <text x="400" y="300" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#888">Stats</text>
  <text x="550" y="300" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#888">Memory</text>
  
  <!-- Legend -->
  <rect x="50" y="440" width="700" height="45" rx="4" fill="#252540"/>
  <text x="70" y="467" font-family="system-ui, sans-serif" font-size="11" fill="#888">Key Features:</text>
  <circle cx="170" cy="462" r="5" fill="url(#ioGrad)"/>
  <text x="180" y="467" font-family="system-ui, sans-serif" font-size="10" fill="#aaa">Zero-Copy I/O</text>
  <circle cx="300" cy="462" r="5" fill="url(#processingGrad)"/>
  <text x="310" y="467" font-family="system-ui, sans-serif" font-size="10" fill="#aaa">Parallel Pipeline</text>
  <circle cx="440" cy="462" r="5" fill="url(#statsGrad)"/>
  <text x="450" y="467" font-family="system-ui, sans-serif" font-size="10" fill="#aaa">Real-time Stats</text>
  <circle cx="570" cy="462" r="5" fill="#3d3d5c"/>
  <text x="580" y="467" font-family="system-ui, sans-serif" font-size="10" fill="#aaa">Memory Pool</text>
  <text x="700" y="467" font-family="system-ui, sans-serif" font-size="10" fill="#666">C++23</text>
</svg>