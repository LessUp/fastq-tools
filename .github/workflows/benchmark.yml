name: Performance Benchmark

on:
  push:
    branches: [master]
    paths:
      - 'src/**'
      - 'include/**'
      - 'tools/benchmark/**'
      - 'config/conan/**'
      - 'config/dependencies/**'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - '.github/workflows/benchmark.yml'
      - '.github/actions/setup-cpp/**'
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:
    inputs:
      save_baseline:
        description: 'Save results as baseline'
        required: false
        default: 'false'
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CONAN_VERSION: '2.24.0'
  CMAKE_VERSION: '4.0.2'

jobs:
  benchmark:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Conan packages
        uses: actions/cache@v4
        with:
          path: ~/.conan2
          key: ${{ runner.os }}-conan-gcc-benchmark-${{ hashFiles('config/dependencies/**') }}
          restore-keys: |
            ${{ runner.os }}-conan-gcc-benchmark-
            ${{ runner.os }}-conan-gcc-
            ${{ runner.os }}-conan-

      - name: Setup benchmark toolchain
        uses: ./.github/actions/setup-cpp
        with:
          cmake-version: ${{ env.CMAKE_VERSION }}
          conan-version: ${{ env.CONAN_VERSION }}
          compiler: gcc
          extra-python-packages: matplotlib

      - name: Install dependencies for gcc-release
        run: |
          conan install config/dependencies/ --build=missing \
            -of=build/gcc-release \
            -s build_type=Release \
            -pr:h config/conan/profile-gcc \
            -pr:b default

      - name: Configure benchmarks with preset build directory
        run: cmake --preset gcc-release -DBUILD_BENCHMARKS=ON

      - name: Build benchmarks
        run: cmake --build --preset gcc-release --target benchmarks

      - name: Generate test data
        run: |
          python tools/benchmark/scripts/gen_benchmark_data.py \
            --generate-dataset \
            --output-dir docs/benchmark-reports/data

      - name: Run benchmarks
        run: |
          mkdir -p docs/benchmark-reports/results
          ./build/gcc-release/tools/benchmark/benchmark_fastq_io \
            --benchmark_format=json \
            --benchmark_out=docs/benchmark-reports/results/current.json \
            --benchmark_repetitions=3 \
            --benchmark_report_aggregates_only=true

      - name: Download baseline (if exists)
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: benchmark-baseline
          path: docs/benchmark-reports/baselines/

      - name: Check for regressions
        run: |
          if [[ -f docs/benchmark-reports/baselines/default.json ]]; then
            python tools/benchmark/scripts/regression_detector.py \
              docs/benchmark-reports/baselines/default.json \
              docs/benchmark-reports/results/current.json \
              --google-benchmark --ci
          else
            echo 'No baseline found, skipping regression check'
          fi

      - name: Generate report
        run: |
          python tools/benchmark/scripts/report_generator.py \
            docs/benchmark-reports/results/current.json \
            --google-benchmark \
            --format markdown \
            --charts

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: |
            docs/benchmark-reports/results/
            docs/benchmark-reports/charts/
            docs/benchmark-reports/latest.md
            docs/benchmark-reports/latest.json

      - name: Save as baseline
        if: (github.event_name == 'push' && github.ref == 'refs/heads/master') || github.event.inputs.save_baseline == 'true'
        run: |
          mkdir -p docs/benchmark-reports/baselines
          cp docs/benchmark-reports/results/current.json docs/benchmark-reports/baselines/default.json

      - name: Upload baseline
        if: (github.event_name == 'push' && github.ref == 'refs/heads/master') || github.event.inputs.save_baseline == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-baseline
          path: docs/benchmark-reports/baselines/default.json
          retention-days: 90
