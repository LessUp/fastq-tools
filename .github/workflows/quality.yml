# .github/workflows/quality.yml
#
# Code Quality Checks for FastQTools
# Runs on every PR and push to main branch
#
# Includes:
# - Code formatting check (clang-format)
# - Static analysis (clang-tidy, cppcheck)
# - AddressSanitizer tests
# - Code coverage reporting

name: Code Quality

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CONAN_VERSION: "2.24.0"
  CMAKE_VERSION: "4.0.2"
  LLVM_VERSION: "21"
  CONAN_HOME: ${{ github.workspace }}/.conan2

jobs:
  # ===========================================================================
  # Code Formatting Check
  # ===========================================================================
  format-check:
    name: Format Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install clang-format
        run: |
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh ${{ env.LLVM_VERSION }}
          sudo apt-get install -y clang-format-${{ env.LLVM_VERSION }}
          sudo update-alternatives --install /usr/bin/clang-format clang-format /usr/bin/clang-format-${{ env.LLVM_VERSION }} 100

      - name: Check formatting
        run: |
          ./scripts/core/lint format-check

  # ===========================================================================
  # Static Analysis (clang-tidy + cppcheck)
  # ===========================================================================
  static-analysis:
    name: Static Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential wget ninja-build ccache tar xz-utils cppcheck python3-pip

          # CMake 4.x
          CMAKE_ARCH=x86_64
          sudo wget -q "https://github.com/Kitware/CMake/releases/download/v${{ env.CMAKE_VERSION }}/cmake-${{ env.CMAKE_VERSION }}-linux-${CMAKE_ARCH}.tar.gz" -O /tmp/cmake.tar.gz
          sudo mkdir -p /opt
          sudo tar -C /opt -xzf /tmp/cmake.tar.gz
          sudo ln -sf "/opt/cmake-${{ env.CMAKE_VERSION }}-linux-${CMAKE_ARCH}/bin/cmake" /usr/local/bin/cmake
          sudo ln -sf "/opt/cmake-${{ env.CMAKE_VERSION }}-linux-${CMAKE_ARCH}/bin/ctest" /usr/local/bin/ctest
          sudo ln -sf "/opt/cmake-${{ env.CMAKE_VERSION }}-linux-${CMAKE_ARCH}/bin/cpack" /usr/local/bin/cpack
          sudo rm -f /tmp/cmake.tar.gz

          # 移除系统旧版 libc++，避免头文件冲突
          sudo apt-get remove -y libc++-dev libc++abi-dev 2>/dev/null || true
          sudo rm -rf /usr/include/c++/v1/

          # Clang/LLVM
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh ${{ env.LLVM_VERSION }}
          sudo apt-get install -y \
            clang-${{ env.LLVM_VERSION }} \
            clang-tidy-${{ env.LLVM_VERSION }} \
            lld-${{ env.LLVM_VERSION }} \
            libc++-${{ env.LLVM_VERSION }}-dev \
            libc++abi-${{ env.LLVM_VERSION }}-dev
          sudo update-alternatives --install /usr/bin/clang      clang      /usr/bin/clang-${{ env.LLVM_VERSION }}      100
          sudo update-alternatives --install /usr/bin/clang++    clang++    /usr/bin/clang++-${{ env.LLVM_VERSION }}    100
          sudo update-alternatives --install /usr/bin/clang-tidy clang-tidy /usr/bin/clang-tidy-${{ env.LLVM_VERSION }} 100
          sudo update-alternatives --install /usr/bin/ld.lld     ld.lld     /usr/bin/ld.lld-${{ env.LLVM_VERSION }}     100

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Conan
        run: |
          pip install conan==${{ env.CONAN_VERSION }}
          conan profile detect --force

      - name: Cache Conan packages
        uses: actions/cache@v4
        with:
          path: ${{ env.CONAN_HOME }}
          key: "conan-${{ runner.os }}-clang-${{ hashFiles('config/dependencies/**') }}"
          restore-keys: |
            conan-${{ runner.os }}-clang-
            conan-${{ runner.os }}-

      - name: Build for analysis
        run: |
          ./scripts/core/build -c clang -t Debug

      - name: Run clang-tidy
        run: |
          ./scripts/core/lint tidy -b build-clang-debug

      - name: Run Cppcheck
        run: |
          ./scripts/core/lint cppcheck -b build-clang-debug

  # ===========================================================================
  # AddressSanitizer Tests
  # ===========================================================================
  asan-tests:
    name: ASan Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential wget ninja-build ccache tar xz-utils python3-pip

          # CMake 4.x
          CMAKE_ARCH=x86_64
          sudo wget -q "https://github.com/Kitware/CMake/releases/download/v${{ env.CMAKE_VERSION }}/cmake-${{ env.CMAKE_VERSION }}-linux-${CMAKE_ARCH}.tar.gz" -O /tmp/cmake.tar.gz
          sudo mkdir -p /opt
          sudo tar -C /opt -xzf /tmp/cmake.tar.gz
          sudo ln -sf "/opt/cmake-${{ env.CMAKE_VERSION }}-linux-${CMAKE_ARCH}/bin/cmake" /usr/local/bin/cmake
          sudo ln -sf "/opt/cmake-${{ env.CMAKE_VERSION }}-linux-${CMAKE_ARCH}/bin/ctest" /usr/local/bin/ctest
          sudo ln -sf "/opt/cmake-${{ env.CMAKE_VERSION }}-linux-${CMAKE_ARCH}/bin/cpack" /usr/local/bin/cpack
          sudo rm -f /tmp/cmake.tar.gz

          # 移除系统旧版 libc++，避免头文件冲突
          sudo apt-get remove -y libc++-dev libc++abi-dev 2>/dev/null || true
          sudo rm -rf /usr/include/c++/v1/

          # Clang/LLVM
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh ${{ env.LLVM_VERSION }}
          sudo apt-get install -y \
            clang-${{ env.LLVM_VERSION }} \
            lld-${{ env.LLVM_VERSION }} \
            libc++-${{ env.LLVM_VERSION }}-dev \
            libc++abi-${{ env.LLVM_VERSION }}-dev
          sudo update-alternatives --install /usr/bin/clang   clang   /usr/bin/clang-${{ env.LLVM_VERSION }}   100
          sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-${{ env.LLVM_VERSION }} 100
          sudo update-alternatives --install /usr/bin/ld.lld  ld.lld  /usr/bin/ld.lld-${{ env.LLVM_VERSION }}  100

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Conan
        run: |
          pip install conan==${{ env.CONAN_VERSION }}
          conan profile detect --force

      - name: Cache Conan packages
        uses: actions/cache@v4
        with:
          path: ${{ env.CONAN_HOME }}
          key: "conan-${{ runner.os }}-clang-${{ hashFiles('config/dependencies/**') }}"
          restore-keys: |
            conan-${{ runner.os }}-clang-
            conan-${{ runner.os }}-

      - name: Build with ASan
        run: |
          ./scripts/core/build -c clang -t Debug --sanitizer asan

      - name: Run tests with ASan
        env:
          ASAN_OPTIONS: "detect_leaks=1:halt_on_error=1:print_stats=1"
        run: |
          ./scripts/core/test -b build-clang-debug

  # ===========================================================================
  # Code Coverage
  # ===========================================================================
  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential wget ninja-build ccache tar xz-utils lcov python3-pip

          # CMake 4.x
          CMAKE_ARCH=x86_64
          sudo wget -q "https://github.com/Kitware/CMake/releases/download/v${{ env.CMAKE_VERSION }}/cmake-${{ env.CMAKE_VERSION }}-linux-${CMAKE_ARCH}.tar.gz" -O /tmp/cmake.tar.gz
          sudo mkdir -p /opt
          sudo tar -C /opt -xzf /tmp/cmake.tar.gz
          sudo ln -sf "/opt/cmake-${{ env.CMAKE_VERSION }}-linux-${CMAKE_ARCH}/bin/cmake" /usr/local/bin/cmake
          sudo ln -sf "/opt/cmake-${{ env.CMAKE_VERSION }}-linux-${CMAKE_ARCH}/bin/ctest" /usr/local/bin/ctest
          sudo ln -sf "/opt/cmake-${{ env.CMAKE_VERSION }}-linux-${CMAKE_ARCH}/bin/cpack" /usr/local/bin/cpack
          sudo rm -f /tmp/cmake.tar.gz

          # 移除系统旧版 libc++，避免头文件冲突
          sudo apt-get remove -y libc++-dev libc++abi-dev 2>/dev/null || true
          sudo rm -rf /usr/include/c++/v1/

          # Clang/LLVM
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh ${{ env.LLVM_VERSION }}
          sudo apt-get install -y \
            clang-${{ env.LLVM_VERSION }} \
            llvm-${{ env.LLVM_VERSION }} \
            lld-${{ env.LLVM_VERSION }} \
            libc++-${{ env.LLVM_VERSION }}-dev \
            libc++abi-${{ env.LLVM_VERSION }}-dev
          sudo update-alternatives --install /usr/bin/clang   clang   /usr/bin/clang-${{ env.LLVM_VERSION }}   100
          sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-${{ env.LLVM_VERSION }} 100
          sudo update-alternatives --install /usr/bin/ld.lld  ld.lld  /usr/bin/ld.lld-${{ env.LLVM_VERSION }}  100

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Conan
        run: |
          pip install conan==${{ env.CONAN_VERSION }} gcovr
          conan profile detect --force

      - name: Cache Conan packages
        uses: actions/cache@v4
        with:
          path: ${{ env.CONAN_HOME }}
          key: "conan-${{ runner.os }}-clang-${{ hashFiles('config/dependencies/**') }}"
          restore-keys: |
            conan-${{ runner.os }}-clang-
            conan-${{ runner.os }}-

      - name: Build with coverage
        run: |
          ./scripts/core/build -c clang --coverage

      - name: Run tests
        run: |
          ./scripts/core/test -c clang --coverage -j 2

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: coverage_report/coverage.xml
          fail_ci_if_error: false
          verbose: true

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage_report/
          retention-days: 7

  # ===========================================================================
  # Quality Gate — 汇总所有检查结果
  # ===========================================================================
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs: [format-check, static-analysis, asan-tests, coverage]
    if: always()

    steps:
      - name: Check results
        run: |
          echo "## Quality Gate Results" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Check | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|--------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Format Check    | ${{ needs.format-check.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Static Analysis | ${{ needs.static-analysis.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| ASan Tests      | ${{ needs.asan-tests.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Coverage        | ${{ needs.coverage.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [[ "${{ needs.format-check.result }}" != "success" ]]; then
            echo "::error::Format check failed"
            exit 1
          fi
          if [[ "${{ needs.static-analysis.result }}" != "success" ]]; then
            echo "::error::Static analysis failed"
            exit 1
          fi
          if [[ "${{ needs.asan-tests.result }}" != "success" ]]; then
            echo "::error::ASan tests failed"
            exit 1
          fi
          if [[ "${{ needs.coverage.result }}" != "success" ]]; then
            echo "::error::Coverage generation failed"
            exit 1
          fi
          echo "All quality checks passed!"
