# .github/workflows/quality.yml
#
# Code Quality Checks for FastQTools
# Runs on every PR and push to main branch
#
# Includes:
# - Code formatting check (clang-format)
# - Static analysis (clang-tidy, cppcheck)
# - AddressSanitizer tests
# - Code coverage reporting

name: Code Quality

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CONAN_VERSION: "2.24.0"
  CMAKE_VERSION: "4.0.2"
  LLVM_VERSION: "21"
  CONAN_HOME: ${{ github.workspace }}/.conan2

jobs:
  # ===========================================================================
  # Code Formatting Check
  # ===========================================================================
  format-check:
    name: Format Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Install clang-format
        run: |
          wget -q --tries=3 --waitretry=5 https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh ${{ env.LLVM_VERSION }}
          sudo apt-get install -y --fix-missing clang-format-${{ env.LLVM_VERSION }}
          sudo update-alternatives --install /usr/bin/clang-format clang-format /usr/bin/clang-format-${{ env.LLVM_VERSION }} 100

      - name: Auto-format all files
        run: |
          find src include tests -type f \( -name "*.cpp" -o -name "*.h" -o -name "*.hpp" \) \
            -exec clang-format --style=file:.clang-format -i {} +

      - name: Check for formatting changes
        run: |
          if git diff --exit-code; then
            echo "代码格式检查通过 ✓"
          else
            echo "::error::以上文件存在格式问题"
            exit 1
          fi


  # ===========================================================================
  # Static Analysis (clang-tidy + cppcheck)
  # ===========================================================================
  static-analysis:
    name: Static Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y --fix-missing \
            build-essential wget ninja-build ccache tar xz-utils cppcheck python3-pip

          # CMake 4.x
          CMAKE_ARCH=x86_64
          sudo wget -q --tries=3 --waitretry=5 "https://github.com/Kitware/CMake/releases/download/v${{ env.CMAKE_VERSION }}/cmake-${{ env.CMAKE_VERSION }}-linux-${CMAKE_ARCH}.tar.gz" -O /tmp/cmake.tar.gz
          sudo mkdir -p /opt
          sudo tar -C /opt -xzf /tmp/cmake.tar.gz
          sudo ln -sf "/opt/cmake-${{ env.CMAKE_VERSION }}-linux-${CMAKE_ARCH}/bin/cmake" /usr/local/bin/cmake
          sudo ln -sf "/opt/cmake-${{ env.CMAKE_VERSION }}-linux-${CMAKE_ARCH}/bin/ctest" /usr/local/bin/ctest
          sudo ln -sf "/opt/cmake-${{ env.CMAKE_VERSION }}-linux-${CMAKE_ARCH}/bin/cpack" /usr/local/bin/cpack
          sudo rm -f /tmp/cmake.tar.gz

          # 仅安装 clang-tidy 分析工具（构建使用 GCC，避免 libc++ 冲突）
          wget -q --tries=3 --waitretry=5 https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh ${{ env.LLVM_VERSION }}
          sudo apt-get install -y --fix-missing clang-tidy-${{ env.LLVM_VERSION }}
          sudo update-alternatives --install /usr/bin/clang-tidy clang-tidy /usr/bin/clang-tidy-${{ env.LLVM_VERSION }} 100

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Conan
        run: |
          pip install conan==${{ env.CONAN_VERSION }}
          conan profile detect --force

      - name: Cache Conan packages
        uses: actions/cache@v4
        with:
          path: ${{ env.CONAN_HOME }}
          key: "conan-${{ runner.os }}-gcc-sa-${{ hashFiles('config/dependencies/**') }}"
          restore-keys: |
            conan-${{ runner.os }}-gcc-
            conan-${{ runner.os }}-

      - name: Build for analysis
        run: |
          conan install config/dependencies/ --build=missing -of=build-gcc-debug -s build_type=Debug
          cmake -B build-gcc-debug -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_TOOLCHAIN_FILE=build-gcc-debug/conan_toolchain.cmake \
            -DCMAKE_C_COMPILER=gcc \
            -DCMAKE_CXX_COMPILER=g++ \
            -DBUILD_TESTING=ON \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          cmake --build build-gcc-debug

      - name: Run clang-tidy
        run: |
          ./scripts/core/lint tidy -b build-gcc-debug

      - name: Run Cppcheck
        run: |
          ./scripts/core/lint cppcheck -b build-gcc-debug

  # ===========================================================================
  # AddressSanitizer Tests
  # ===========================================================================
  asan-tests:
    name: ASan Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y --fix-missing \
            build-essential wget ninja-build ccache tar xz-utils python3-pip

          # CMake 4.x
          CMAKE_ARCH=x86_64
          sudo wget -q --tries=3 --waitretry=5 "https://github.com/Kitware/CMake/releases/download/v${{ env.CMAKE_VERSION }}/cmake-${{ env.CMAKE_VERSION }}-linux-${CMAKE_ARCH}.tar.gz" -O /tmp/cmake.tar.gz
          sudo mkdir -p /opt
          sudo tar -C /opt -xzf /tmp/cmake.tar.gz
          sudo ln -sf "/opt/cmake-${{ env.CMAKE_VERSION }}-linux-${CMAKE_ARCH}/bin/cmake" /usr/local/bin/cmake
          sudo ln -sf "/opt/cmake-${{ env.CMAKE_VERSION }}-linux-${CMAKE_ARCH}/bin/ctest" /usr/local/bin/ctest
          sudo ln -sf "/opt/cmake-${{ env.CMAKE_VERSION }}-linux-${CMAKE_ARCH}/bin/cpack" /usr/local/bin/cpack
          sudo rm -f /tmp/cmake.tar.gz

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Conan
        run: |
          pip install conan==${{ env.CONAN_VERSION }}
          conan profile detect --force

      - name: Cache Conan packages
        uses: actions/cache@v4
        with:
          path: ${{ env.CONAN_HOME }}
          key: "conan-${{ runner.os }}-gcc-asan-${{ hashFiles('config/dependencies/**') }}"
          restore-keys: |
            conan-${{ runner.os }}-gcc-
            conan-${{ runner.os }}-

      - name: Build with ASan
        run: |
          conan install config/dependencies/ --build=missing -of=build-gcc-asan -s build_type=Debug
          cmake -B build-gcc-asan -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_TOOLCHAIN_FILE=build-gcc-asan/conan_toolchain.cmake \
            -DCMAKE_C_COMPILER=gcc \
            -DCMAKE_CXX_COMPILER=g++ \
            -DENABLE_ASAN=ON \
            -DBUILD_TESTING=ON
          cmake --build build-gcc-asan

      - name: Run tests with ASan
        env:
          ASAN_OPTIONS: "detect_leaks=1:halt_on_error=1:print_stats=1"
        run: |
          ctest --test-dir build-gcc-asan --output-on-failure -j 2

  # ===========================================================================
  # Code Coverage
  # ===========================================================================
  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y --fix-missing \
            build-essential wget ninja-build ccache tar xz-utils lcov python3-pip

          # CMake 4.x
          CMAKE_ARCH=x86_64
          sudo wget -q --tries=3 --waitretry=5 "https://github.com/Kitware/CMake/releases/download/v${{ env.CMAKE_VERSION }}/cmake-${{ env.CMAKE_VERSION }}-linux-${CMAKE_ARCH}.tar.gz" -O /tmp/cmake.tar.gz
          sudo mkdir -p /opt
          sudo tar -C /opt -xzf /tmp/cmake.tar.gz
          sudo ln -sf "/opt/cmake-${{ env.CMAKE_VERSION }}-linux-${CMAKE_ARCH}/bin/cmake" /usr/local/bin/cmake
          sudo ln -sf "/opt/cmake-${{ env.CMAKE_VERSION }}-linux-${CMAKE_ARCH}/bin/ctest" /usr/local/bin/ctest
          sudo ln -sf "/opt/cmake-${{ env.CMAKE_VERSION }}-linux-${CMAKE_ARCH}/bin/cpack" /usr/local/bin/cpack
          sudo rm -f /tmp/cmake.tar.gz

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Conan
        run: |
          pip install conan==${{ env.CONAN_VERSION }} gcovr
          conan profile detect --force

      - name: Cache Conan packages
        uses: actions/cache@v4
        with:
          path: ${{ env.CONAN_HOME }}
          key: "conan-${{ runner.os }}-gcc-cov-${{ hashFiles('config/dependencies/**') }}"
          restore-keys: |
            conan-${{ runner.os }}-gcc-
            conan-${{ runner.os }}-

      - name: Build with coverage
        run: |
          conan install config/dependencies/ --build=missing -of=build-gcc-coverage -s build_type=Debug
          cmake -B build-gcc-coverage -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_TOOLCHAIN_FILE=build-gcc-coverage/conan_toolchain.cmake \
            -DCMAKE_C_COMPILER=gcc \
            -DCMAKE_CXX_COMPILER=g++ \
            -DENABLE_COVERAGE=ON \
            -DBUILD_TESTING=ON
          cmake --build build-gcc-coverage

      - name: Run tests
        run: |
          ctest --test-dir build-gcc-coverage --output-on-failure -j 2

      - name: Generate coverage report
        run: |
          bash ./scripts/tools/coverage-report -b build-gcc-coverage -o coverage_report --xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: coverage_report/coverage.xml
          fail_ci_if_error: false
          verbose: true

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage_report/
          retention-days: 7

  # ===========================================================================
  # Quality Gate — 汇总所有检查结果
  # ===========================================================================
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs: [format-check, static-analysis, asan-tests, coverage]
    if: always()

    steps:
      - name: Check results
        run: |
          echo "## Quality Gate Results" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Check | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|--------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Format Check    | ${{ needs.format-check.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Static Analysis | ${{ needs.static-analysis.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| ASan Tests      | ${{ needs.asan-tests.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Coverage        | ${{ needs.coverage.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [[ "${{ needs.format-check.result }}" != "success" ]]; then
            echo "::error::Format check failed"
            exit 1
          fi
          if [[ "${{ needs.static-analysis.result }}" != "success" ]]; then
            echo "::warning::Static analysis has warnings (non-blocking)"
          fi
          if [[ "${{ needs.asan-tests.result }}" != "success" ]]; then
            echo "::error::ASan tests failed"
            exit 1
          fi
          if [[ "${{ needs.coverage.result }}" != "success" ]]; then
            echo "::error::Coverage generation failed"
            exit 1
          fi
          echo "All quality checks passed!"
