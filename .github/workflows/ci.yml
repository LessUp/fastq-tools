# .github/workflows/ci.yml
name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CONAN_VERSION: "2.24.0"
  CMAKE_VERSION: "4.0.2"
  LLVM_VERSION: "20"

jobs:
  # ===========================================================================
  # Commitlint — PR 提交信息规范检查
  # ===========================================================================
  commitlint:
    name: Commitlint
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run commitlint
        run: |
          npm install -g @commitlint/cli @commitlint/config-conventional
          commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

  # ===========================================================================
  # Build & Test 矩阵
  # ===========================================================================
  build-and-test:
    name: "${{ matrix.compiler.name }} / ${{ matrix.build_type }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler:
          - { name: "gcc", cc: "gcc", cxx: "g++" }
          - { name: "clang", cc: "clang", cxx: "clang++" }
        build_type: [Debug, Release]
        exclude:
          - compiler: { name: "gcc" }
            build_type: Debug

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Conan
        uses: actions/cache@v4
        with:
          path: ~/.conan2
          key: "${{ runner.os }}-conan-${{ matrix.compiler.name }}-${{ hashFiles('config/dependencies/**') }}"
          restore-keys: |
            ${{ runner.os }}-conan-${{ matrix.compiler.name }}-
            ${{ runner.os }}-conan-

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: "${{ runner.os }}-ccache-${{ matrix.compiler.name }}-${{ matrix.build_type }}-${{ github.sha }}"
          restore-keys: |
            ${{ runner.os }}-ccache-${{ matrix.compiler.name }}-${{ matrix.build_type }}-
            ${{ runner.os }}-ccache-${{ matrix.compiler.name }}-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential wget ninja-build ccache tar xz-utils

          CMAKE_ARCH=x86_64
          sudo wget -q "https://github.com/Kitware/CMake/releases/download/v${{ env.CMAKE_VERSION }}/cmake-${{ env.CMAKE_VERSION }}-linux-${CMAKE_ARCH}.tar.gz" -O /tmp/cmake.tar.gz
          sudo mkdir -p /opt
          sudo tar -C /opt -xzf /tmp/cmake.tar.gz
          sudo ln -sf "/opt/cmake-${{ env.CMAKE_VERSION }}-linux-${CMAKE_ARCH}/bin/cmake" /usr/local/bin/cmake
          sudo ln -sf "/opt/cmake-${{ env.CMAKE_VERSION }}-linux-${CMAKE_ARCH}/bin/ctest" /usr/local/bin/ctest
          sudo ln -sf "/opt/cmake-${{ env.CMAKE_VERSION }}-linux-${CMAKE_ARCH}/bin/cpack" /usr/local/bin/cpack
          sudo rm -f /tmp/cmake.tar.gz

      - name: Install Clang/LLVM
        if: matrix.compiler.name == 'clang'
        run: |
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh ${{ env.LLVM_VERSION }}
          sudo apt-get install -y \
            clang-${{ env.LLVM_VERSION }} \
            lld-${{ env.LLVM_VERSION }} \
            libc++-${{ env.LLVM_VERSION }}-dev \
            libc++abi-${{ env.LLVM_VERSION }}-dev
          sudo update-alternatives --install /usr/bin/clang   clang   /usr/bin/clang-${{ env.LLVM_VERSION }}   100
          sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-${{ env.LLVM_VERSION }} 100
          sudo update-alternatives --install /usr/bin/ld.lld  ld.lld  /usr/bin/ld.lld-${{ env.LLVM_VERSION }}  100

          # 使用匹配版本的 libc++ 头文件，避免系统旧版头文件导致编译失败
          sudo rm -rf /usr/include/c++/v1
          sudo ln -sf /usr/lib/llvm-${{ env.LLVM_VERSION }}/include/c++/v1 /usr/include/c++/v1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Conan
        run: |
          pip install conan==${{ env.CONAN_VERSION }}
          conan profile detect --force

      - name: Build
        run: |
          BUILD_DIR="build-${{ matrix.compiler.name }}-$(echo '${{ matrix.build_type }}' | tr 'A-Z' 'a-z')"
          if [ "${{ matrix.compiler.name }}" = "clang" ]; then
            CC_COMP=clang
            CXX_COMP=clang++
          else
            CC_COMP=gcc
            CXX_COMP=g++
          fi
          CONAN_EXTRA_ARGS=""
          if [ "${{ matrix.compiler.name }}" = "clang" ]; then
            CONAN_EXTRA_ARGS="-pr:h config/conan/profile-clang"
          fi
          conan install config/dependencies/ --build=missing \
            -s build_type=${{ matrix.build_type }} -of="${BUILD_DIR}" ${CONAN_EXTRA_ARGS}
          cmake -B "${BUILD_DIR}" -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_TOOLCHAIN_FILE="${BUILD_DIR}/conan_toolchain.cmake" \
            -DCMAKE_C_COMPILER="${CC_COMP}" \
            -DCMAKE_CXX_COMPILER="${CXX_COMP}" \
            -DBUILD_TESTING=ON
          cmake --build "${BUILD_DIR}" -j $(nproc)

      - name: Run tests
        run: |
          BUILD_DIR="build-${{ matrix.compiler.name }}-$(echo '${{ matrix.build_type }}' | tr 'A-Z' 'a-z')"
          ctest --test-dir "${BUILD_DIR}" --output-on-failure -j 2

      - name: Upload build artifacts
        if: matrix.build_type == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: "fastqtools-${{ matrix.compiler.name }}-release"
          path: "build-${{ matrix.compiler.name }}-release/FastQTools"
          retention-days: 7

  # ===========================================================================
  # Docker Build
  # ===========================================================================
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build production image
        run: docker build -f docker/Dockerfile.prod -t fastqtools:latest .

      - name: Build development image
        run: docker build -f docker/Dockerfile.dev -t fastqtools:dev .

      - name: Smoke test production image
        run: docker run --rm fastqtools:latest fastqtools --help

      - name: Smoke test development image
        run: docker run --rm fastqtools:dev bash -c "gcc --version"
