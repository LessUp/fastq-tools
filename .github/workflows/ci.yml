name: CI

on:
  push:
    branches: [master]
    paths-ignore:
      - 'docs/**'
      - 'openspec/**'
      - 'changelog/**'
      - '**/*.md'
  pull_request:
    branches: [master]
    paths-ignore:
      - 'docs/**'
      - 'openspec/**'
      - 'changelog/**'
      - '**/*.md'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CONAN_VERSION: '2.24.0'
  CMAKE_VERSION: '4.0.2'
  LLVM_VERSION: '21'

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup formatter
        uses: ./.github/actions/setup-cpp
        with:
          cmake-version: ${{ env.CMAKE_VERSION }}
          llvm-version: ${{ env.LLVM_VERSION }}
          install-conan: 'false'
          install-clang-format: 'true'

      - name: Run format check
        run: ./scripts/core/lint format-check

  static-analysis:
    name: Static Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Conan packages
        uses: actions/cache@v4
        with:
          path: ~/.conan2
          key: ${{ runner.os }}-conan-gcc-analysis-${{ hashFiles('config/dependencies/**') }}
          restore-keys: |
            ${{ runner.os }}-conan-gcc-analysis-
            ${{ runner.os }}-conan-gcc-
            ${{ runner.os }}-conan-

      - name: Setup analysis toolchain
        uses: ./.github/actions/setup-cpp
        with:
          cmake-version: ${{ env.CMAKE_VERSION }}
          conan-version: ${{ env.CONAN_VERSION }}
          llvm-version: ${{ env.LLVM_VERSION }}
          compiler: gcc
          install-clang-tools: 'true'
          install-cppcheck: 'true'

      - name: Build gcc-debug preset
        run: ./scripts/core/build --preset gcc-debug --no-lto

      - name: Run clang-tidy
        run: ./scripts/core/lint tidy --preset gcc-debug

      - name: Run cppcheck
        run: ./scripts/core/lint cppcheck --preset gcc-debug

  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GCC Release
            compiler: gcc
            build_command: ./scripts/core/build --preset gcc-release --no-lto
            test_command: ./scripts/core/test --preset gcc-release --timeout 180
          - name: Clang Release
            compiler: clang
            build_command: ./scripts/core/build --compiler clang --type Release --build-dir build/ci-clang-release --conan-profile config/conan/profile-clang-ci --no-lto
            test_command: ./scripts/core/test --build-dir build/ci-clang-release --timeout 180
          - name: Clang ASan
            compiler: clang
            build_command: ./scripts/core/build --compiler clang --type Debug --sanitizer asan --build-dir build/ci-clang-asan --conan-profile config/conan/profile-clang-ci --no-lto
            test_command: ctest --test-dir build/ci-clang-asan --exclude-regex 'cmake_package_consumer'
          - name: Clang TSan
            compiler: clang
            build_command: ./scripts/core/build --compiler clang --type Debug --sanitizer tsan --build-dir build/ci-clang-tsan --conan-profile config/conan/profile-clang-ci --no-lto
            test_command: ctest --test-dir build/ci-clang-tsan --exclude-regex 'cmake_package_consumer'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Conan packages
        uses: actions/cache@v4
        with:
          path: ~/.conan2
          key: ${{ runner.os }}-conan-${{ matrix.compiler }}-${{ hashFiles('config/dependencies/**') }}
          restore-keys: |
            ${{ runner.os }}-conan-${{ matrix.compiler }}-
            ${{ runner.os }}-conan-

      - name: Setup build toolchain
        uses: ./.github/actions/setup-cpp
        with:
          cmake-version: ${{ env.CMAKE_VERSION }}
          conan-version: ${{ env.CONAN_VERSION }}
          llvm-version: ${{ env.LLVM_VERSION }}
          compiler: ${{ matrix.compiler }}

      - name: Build preset
        run: ${{ matrix.build_command }}

      - name: Run tests
        run: ${{ matrix.test_command }}

  coverage:
    name: Coverage
    if: github.event_name == 'push'
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Conan packages
        uses: actions/cache@v4
        with:
          path: ~/.conan2
          key: ${{ runner.os }}-conan-gcc-coverage-${{ hashFiles('config/dependencies/**') }}
          restore-keys: |
            ${{ runner.os }}-conan-gcc-coverage-
            ${{ runner.os }}-conan-gcc-
            ${{ runner.os }}-conan-

      - name: Setup coverage toolchain
        uses: ./.github/actions/setup-cpp
        with:
          cmake-version: ${{ env.CMAKE_VERSION }}
          conan-version: ${{ env.CONAN_VERSION }}
          compiler: gcc
          install-lcov: 'true'
          extra-python-packages: gcovr

      - name: Build coverage preset
        run: ./scripts/core/build --preset coverage --no-lto

      - name: Run coverage tests
        run: ctest --preset coverage --exclude-regex 'cmake_package_consumer'

      - name: Generate coverage report
        run: bash ./scripts/tools/analysis/coverage-report -b build/coverage -o coverage_report --xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: coverage_report/coverage.xml
          fail_ci_if_error: false
          verbose: true

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage_report/
          retention-days: 7

  docker-smoke:
    name: Docker Smoke
    if: github.event_name == 'push'
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build production image
        run: docker build -f docker/Dockerfile.prod -t fastqtools:ci .

      - name: Smoke test production image
        run: docker run --rm fastqtools:ci fastqtools --help
