name: Valgrind Check

on:
  schedule:
    - cron: '0 2 * * 0'
  workflow_dispatch:
    inputs:
      full_check:
        description: 'Run helgrind in addition to memcheck'
        required: false
        default: 'false'
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CONAN_VERSION: '2.24.0'
  CMAKE_VERSION: '4.0.2'

jobs:
  valgrind-memcheck:
    name: Valgrind Memcheck
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Conan packages
        uses: actions/cache@v4
        with:
          path: ~/.conan2
          key: ${{ runner.os }}-conan-gcc-valgrind-${{ hashFiles('config/dependencies/**') }}
          restore-keys: |
            ${{ runner.os }}-conan-gcc-valgrind-
            ${{ runner.os }}-conan-gcc-
            ${{ runner.os }}-conan-

      - name: Setup valgrind toolchain
        uses: ./.github/actions/setup-cpp
        with:
          cmake-version: ${{ env.CMAKE_VERSION }}
          conan-version: ${{ env.CONAN_VERSION }}
          compiler: gcc
          install-valgrind: 'true'

      - name: Build gcc-debug preset
        run: ./scripts/core/build --preset gcc-debug --no-lto

      - name: Run Valgrind Memcheck
        id: valgrind
        continue-on-error: true
        run: ./scripts/core/test --preset gcc-debug --valgrind --timeout 180

      - name: Upload Valgrind report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: valgrind-memcheck-report
          path: build/gcc-debug/Testing/Temporary/MemoryChecker*.log
          retention-days: 30

      - name: Check Valgrind result
        if: steps.valgrind.outcome == 'failure'
        run: |
          echo '::warning::Valgrind found memory issues. Check the uploaded report.'
          if [[ '${{ github.event_name }}' == 'workflow_dispatch' ]]; then
            exit 1
          fi

  valgrind-helgrind:
    name: Valgrind Helgrind
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.full_check == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Conan packages
        uses: actions/cache@v4
        with:
          path: ~/.conan2
          key: ${{ runner.os }}-conan-gcc-valgrind-${{ hashFiles('config/dependencies/**') }}
          restore-keys: |
            ${{ runner.os }}-conan-gcc-valgrind-
            ${{ runner.os }}-conan-gcc-
            ${{ runner.os }}-conan-

      - name: Setup helgrind toolchain
        uses: ./.github/actions/setup-cpp
        with:
          cmake-version: ${{ env.CMAKE_VERSION }}
          conan-version: ${{ env.CONAN_VERSION }}
          compiler: gcc
          install-valgrind: 'true'

      - name: Build gcc-debug preset
        run: ./scripts/core/build --preset gcc-debug --no-lto

      - name: Run Valgrind Helgrind
        id: helgrind
        continue-on-error: true
        run: |
          TEST_EXEC=$(find build/gcc-debug/tests -type f -executable -name 'test_*' | sort | head -1)
          if [[ -z "$TEST_EXEC" ]]; then
            echo 'No test executable found for Helgrind' >&2
            exit 1
          fi

          valgrind --tool=helgrind \
            --suppressions=config/valgrind/suppressions.supp \
            --error-exitcode=1 \
            "$TEST_EXEC" 2>&1 | tee helgrind_report.txt

      - name: Upload Helgrind report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: valgrind-helgrind-report
          path: helgrind_report.txt
          retention-days: 30

      - name: Check Helgrind result
        if: steps.helgrind.outcome == 'failure'
        run: exit 1
