# .github/workflows/valgrind.yml
#
# Valgrind Memory Check for FastQTools
# Runs weekly to perform deep memory analysis
#
# Valgrind is slower than ASan but can find different types of issues

name: Valgrind Check

on:
  # Run weekly on Sunday at 2:00 AM UTC
  schedule:
    - cron: '0 2 * * 0'

  # Allow manual trigger
  workflow_dispatch:
    inputs:
      full_check:
        description: 'Run full Valgrind check (slower)'
        required: false
        default: 'false'
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_TYPE: Debug
  CONAN_VERSION: "2.24.0"
  CMAKE_VERSION: "4.0.2"
  CONAN_HOME: ${{ github.workspace }}/.conan2

jobs:
  # ===========================================================================
  # Valgrind Memcheck
  # ===========================================================================
  valgrind-memcheck:
    name: Valgrind Memcheck
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y --fix-missing \
            build-essential \
            wget \
            ninja-build \
            ccache \
            tar \
            xz-utils \
            valgrind \
            python3-pip

          # CMake 4.x
          CMAKE_ARCH=x86_64
          sudo wget -q --tries=3 --waitretry=5 "https://github.com/Kitware/CMake/releases/download/v${{ env.CMAKE_VERSION }}/cmake-${{ env.CMAKE_VERSION }}-linux-${CMAKE_ARCH}.tar.gz" -O /tmp/cmake.tar.gz
          sudo mkdir -p /opt
          sudo tar -C /opt -xzf /tmp/cmake.tar.gz
          sudo ln -sf "/opt/cmake-${{ env.CMAKE_VERSION }}-linux-${CMAKE_ARCH}/bin/cmake" /usr/local/bin/cmake
          sudo ln -sf "/opt/cmake-${{ env.CMAKE_VERSION }}-linux-${CMAKE_ARCH}/bin/ctest" /usr/local/bin/ctest
          sudo ln -sf "/opt/cmake-${{ env.CMAKE_VERSION }}-linux-${CMAKE_ARCH}/bin/cpack" /usr/local/bin/cpack
          sudo rm -f /tmp/cmake.tar.gz

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Conan
        run: |
          pip install conan==${{ env.CONAN_VERSION }}
          conan profile detect --force

      - name: Cache Conan packages
        uses: actions/cache@v4
        with:
          path: ${{ env.CONAN_HOME }}
          key: "conan-${{ runner.os }}-gcc-${{ hashFiles('config/dependencies/**') }}"
          restore-keys: |
            conan-${{ runner.os }}-gcc-
            conan-${{ runner.os }}-

      - name: Build
        run: |
          ./scripts/core/build -c gcc -t Debug

      - name: Run Valgrind Memcheck
        run: |
          ./scripts/core/test -b build/gcc-debug --valgrind
        continue-on-error: true
        id: valgrind

      - name: Upload Valgrind report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: valgrind-memcheck-report
          path: |
            build/gcc-debug/Testing/Temporary/MemoryChecker*.log
          retention-days: 30

      - name: Check Valgrind result
        if: steps.valgrind.outcome == 'failure'
        run: |
          echo "::warning::Valgrind found memory issues. Check the uploaded report."
          # Don't fail the workflow for scheduled runs, just warn
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            exit 1
          fi

  # ===========================================================================
  # Valgrind Helgrind (Thread Check)
  # ===========================================================================
  valgrind-helgrind:
    name: Valgrind Helgrind
    runs-on: ubuntu-latest
    timeout-minutes: 180
    if: github.event.inputs.full_check == 'true' || github.event_name == 'schedule'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y --fix-missing \
            build-essential \
            wget \
            ninja-build \
            ccache \
            tar \
            xz-utils \
            valgrind \
            python3-pip

          # CMake 4.x
          CMAKE_ARCH=x86_64
          sudo wget -q --tries=3 --waitretry=5 "https://github.com/Kitware/CMake/releases/download/v${{ env.CMAKE_VERSION }}/cmake-${{ env.CMAKE_VERSION }}-linux-${CMAKE_ARCH}.tar.gz" -O /tmp/cmake.tar.gz
          sudo mkdir -p /opt
          sudo tar -C /opt -xzf /tmp/cmake.tar.gz
          sudo ln -sf "/opt/cmake-${{ env.CMAKE_VERSION }}-linux-${CMAKE_ARCH}/bin/cmake" /usr/local/bin/cmake
          sudo ln -sf "/opt/cmake-${{ env.CMAKE_VERSION }}-linux-${CMAKE_ARCH}/bin/ctest" /usr/local/bin/ctest
          sudo ln -sf "/opt/cmake-${{ env.CMAKE_VERSION }}-linux-${CMAKE_ARCH}/bin/cpack" /usr/local/bin/cpack
          sudo rm -f /tmp/cmake.tar.gz

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Conan
        run: |
          pip install conan==${{ env.CONAN_VERSION }}
          conan profile detect --force

      - name: Cache Conan packages
        uses: actions/cache@v4
        with:
          path: ${{ env.CONAN_HOME }}
          key: "conan-${{ runner.os }}-gcc-${{ hashFiles('config/dependencies/**') }}"
          restore-keys: |
            conan-${{ runner.os }}-gcc-
            conan-${{ runner.os }}-

      - name: Build
        run: |
          ./scripts/core/build -c gcc -t Debug

      - name: Run Valgrind Helgrind
        run: |
          # Run Helgrind on the test executable
          TEST_EXEC=$(find build/gcc-debug -name "*_test" -o -name "*_tests" | head -1)
          if [[ -n "$TEST_EXEC" ]]; then
            valgrind --tool=helgrind \
              --suppressions=config/valgrind/suppressions.supp \
              --error-exitcode=0 \
              "$TEST_EXEC" 2>&1 | tee helgrind_report.txt
          fi
        continue-on-error: true

      - name: Upload Helgrind report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: valgrind-helgrind-report
          path: helgrind_report.txt
          retention-days: 30

  # ===========================================================================
  # Summary
  # ===========================================================================
  summary:
    name: Summary
    runs-on: ubuntu-latest
    needs: [valgrind-memcheck]
    if: always()

    steps:
      - name: Create summary
        run: |
          echo "## Valgrind Check Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Check | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|--------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Memcheck | ${{ needs.valgrind-memcheck.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Reports are available in the workflow artifacts." >> "$GITHUB_STEP_SUMMARY"
