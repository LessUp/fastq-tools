# FastQTools Dependabot Configuration
# 自动更新依赖版本

version: 2

updates:
  # ==================== GitHub Actions ====================
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Asia/Shanghai"
    commit-message:
      prefix: "ci"
      include: "scope"
    labels:
      - "dependencies"
      - "github-actions"
    reviewers:
      - "LessUp"
    open-pulls-limit: 5
    groups:
      actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # ==================== Conan 依赖 ====================
  # 注意：Conan 依赖通过 conanfile.py 管理
  # Dependabot 不直接支持 Conan，但我们可以监控文件变更
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "06:00"
      timezone: "Asia/Shanghai"
    commit-message:
      prefix: "build"
      include: "scope"
    labels:
      - "dependencies"
      - "python"
    ignore:
      # 保持特定版本不变
      - dependency-name: "conan"
        update-types: ["version-update:semver-major"]

  # ==================== Docker 基础镜像 ====================
  # Docker 镜像更新需要手动检查
  # 建议使用 renovate-bot 替代以获得更好的 Docker 支持
